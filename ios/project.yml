name: Rowel
options:
  bundleIdPrefix: ai.novabox
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"
    # Overridable from the environment so a different machine, or CI, does not
    # have to edit a tracked file to build. Empty means simulator only.
    DEVELOPMENT_TEAM: ${ROWEL_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  DshClientCore:
    path: ../Core
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: 1.99.1

targets:
  Rowel:
    type: application
    platform: iOS
    sources:
      - path: Rowel
    dependencies:
      - package: DshClientCore
      - package: SwiftTerm
    settings:
      base:
        # Reverse of a domain that is actually owned, so it cannot collide with
        # someone else's App Store record.
        PRODUCT_BUNDLE_IDENTIFIER: dev.hahach.dafeiyu-dsh-client
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Rowel/Rowel.entitlements
        # iPhone only. The layout is one portrait column and has never been
        # anything else, and claiming the iPad idiom costs three things for no
        # gain: App Store Connect starts demanding a set of 13" iPad
        # screenshots, App Review runs the app on hardware it was not drawn
        # for, and the iPad multitasking rule requires all four orientations —
        # the escape hatch for which, UIRequiresFullScreen, Apple has
        # deprecated (TN3192). Dropping to family 1 settles all three, and an
        # iPhone-only app still installs on iPad in compatibility mode.
        TARGETED_DEVICE_FAMILY: "1"
    # Every key below lives here rather than in `settings.base` as an
    # INFOPLIST_KEY_* entry. Those settings are only consulted when Xcode
    # *generates* the Info.plist; this target ships an explicit one
    # (GENERATE_INFOPLIST_FILE = NO), so an INFOPLIST_KEY_* is evaluated,
    # printed by -showBuildSettings, and then silently dropped on the floor.
    # Six of them were, including three purpose strings the app cannot run
    # without.
    info:
      path: Rowel/Info.plist
      properties:
        CFBundleDisplayName: dafeiyu-dsh-client
        # Both of these defer to the build settings rather than restating the
        # numbers. A literal here wins over anything `xcodebuild` is passed on
        # the command line, which is how every build came out stamped `1` no
        # matter what `release.sh` computed — App Store Connect then refuses
        # the second upload, and the message is about a duplicate version
        # rather than about the plist that produced it.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # One column, one orientation. Stated rather than left to the default,
        # which is portrait *plus* both landscapes on iPhone.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Light appearance only, and the status bar's content colour is pinned
        # here rather than left to a view controller. `false` makes UIKit read
        # UIStatusBarStyle from this plist instead of asking the view
        # hierarchy, so the bar no longer depends on when the system asks.
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UIUserInterfaceStyle: Light
        UIViewControllerBasedStatusBarAppearance: false
        # Purpose strings. Each of these is load-bearing: iOS does not fail a
        # missing one politely, it terminates the process (Termination Reason:
        # Namespace TCC) the first time the matching API is touched.
        #
        # Face ID — AppLock calls LAContext.canEvaluatePolicy, which since
        # iOS 17 is itself enough to trip the check, before any prompt appears.
        NSFaceIDUsageDescription: dafeiyu-dsh-client can ask for Face ID before showing your conversations, so a found phone does not open them.
        # Photos — the composer's PhotosPicker runs out of process and would
        # work without this, but the app does put library images into a
        # message, and the honest declaration costs nothing.
        NSPhotoLibraryUsageDescription: dafeiyu-dsh-client attaches photos you pick to a message.
        # Local network — direct LAN connections skip the relay entirely.
        # Apple's TN3179 lists "making an outgoing TCP connection" as
        # requiring this, Bonjour or not, and since iOS 18 the consent prompt
        # does not even appear without the string: the connection just fails
        # as NSURLErrorNotConnectedToInternet (-1009) with an underlying
        # "Local network prohibited". That is the whole fast path, silently.
        NSLocalNetworkUsageDescription: dafeiyu-dsh-client connects straight to your host when both are on the same Wi-Fi, which is faster and never leaves your network.
        # Export compliance: does the binary carry encryption that is *not*
        # exempt? The answer below turns on what the app links, not on intent.
        #
        # Where the cryptography comes from now: the SSH stack. Core/Package.swift
        # depends on swift-crypto, Citadel and swift-nio-ssh, which bring X25519,
        # Ed25519, ChaCha20-Poly1305 and SHA-256 — standard algorithms, each with
        # an off-the-shelf implementation. SwiftTerm only renders the terminal.
        # Nothing above the transport does cryptography: credentials are a cookie,
        # the SSH key is stored as plaintext with 0600 permissions (LiveContainer
        # cannot rely on the Keychain), and no data is encrypted at rest.
        #
        # The premise this used to rest on is gone: it argued "no third-party
        # dependency of any kind, no algorithm in the binary, every primitive is
        # CryptoKit", which held only while Protocol/Noise.swift was the one piece
        # of in-house protocol code. The fork deleted that file and added three SPM
        # dependencies that do carry algorithm code. The value is unchanged, on the
        # other half of Apple's test: what the binary carries is standard,
        # non-proprietary cryptography, and this repo implements none of its own.
        #
        # Declaring true would oblige export documentation to be filed before any
        # build uploads — altool then refuses with "Invalid Export Compliance Code".
        # This line is a distribution declaration, not a build setting: change it
        # only with the documentation in hand.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Every HTTP request this app makes goes to 127.0.0.1 on the tunnel's
          # local port; the SSH socket itself is not an ATS connection. This
          # exception keeps that loopback path — and any future direct-to-host
          # connection — legal. The pairing relay it used to cover is gone with
          # the fork, as is the Noise ciphertext it used to carry.
          NSAllowsLocalNetworking: true

  RowelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RowelTests
    dependencies:
      - target: Rowel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hahach.dafeiyu-dsh-client.tests
        GENERATE_INFOPLIST_FILE: YES
        # Tests run on the simulator, which needs no team and no profile.
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  Rowel:
    build:
      targets:
        Rowel: all
        RowelTests: [test]
    test:
      targets:
        - RowelTests
      gatherCoverageData: false
